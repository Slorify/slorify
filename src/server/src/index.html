<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Doggy Channel</title>
</head>

<body>
  <h3>Doggy Logs</h3>
  <pre id="logs">Waiting...</pre>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const logsEl = document.getElementById("logs");

    socket.on("connect", () => {
      logsEl.textContent = `Connected: ${socket.id}\n`;
      socket.emit("subscribe"); // 👈 trigger server emit
    });

    // 👂 LISTEN TO HOST CHANNEL
    socket.on("doggy-backend", (data) => {
      logsEl.textContent += data + "\n";
    });

    socket.on("disconnect", () => {
      logsEl.textContent += "Disconnected\n";
    });
  </script>
</body>

</html>
